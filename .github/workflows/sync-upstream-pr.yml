name: Sync upstream -> PR (daily, rebase, auto-merge)

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-pr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/qwibitai/nanoclaw.git || true
          git fetch upstream --prune
          git fetch origin --prune

      - name: Create sync branch and sync with upstream (prefer upstream workflows on conflict)
        shell: bash
        run: |
          set -euo pipefail

          SYNC_BRANCH=sync/upstream-main

          # Start from fork main (keep fork-only commits)
          git checkout -B "$SYNC_BRANCH" origin/main

          echo "Attempt rebase onto upstream/main..."
          if git rebase upstream/main; then
            echo "Rebase succeeded."
            exit 0
          fi

          echo "Rebase failed; aborting rebase and falling back to merge."
          git rebase --abort || true

          echo "Merging upstream/main..."
          # First try a normal merge (fast path)
          if git merge --no-edit upstream/main; then
            echo "Merge succeeded without conflicts."
            exit 0
          fi

          echo "Merge has conflicts. Prefer upstream version for .github/workflows/**"
          # For workflow conflict files, force upstream (theirs)
          CONFLICTED_WORKFLOWS=$(git diff --name-only --diff-filter=U | grep '^\.github/workflows/' || true)

          if [ -n "${CONFLICTED_WORKFLOWS}" ]; then
            echo "Resolving workflow conflicts using upstream (theirs):"
            echo "${CONFLICTED_WORKFLOWS}"

            while IFS= read -r f; do
              [ -z "$f" ] && continue
              git checkout --theirs -- "$f" || true
              git add -- "$f"
            done <<< "${CONFLICTED_WORKFLOWS}"
          fi

          # If any conflicts remain (non-workflow), fail for manual resolution
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain (non-workflow files). Failing."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -m "chore: merge upstream/main (prefer upstream workflows on conflict)"
          echo "Merge completed."

      - name: Push sync branch to fork
        run: |
          SYNC_BRANCH=sync/upstream-main
          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Create or update PR, and enable auto-merge
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: sync/upstream-main
          title: "chore: rebase/merge sync from upstream (qwibitai/nanoclaw)"
          body: |
            Automated daily sync PR.

            - upstream: qwibitai/nanoclaw
            - upstream branch: main
            - strategy: try rebase; if it conflicts, fall back to merge
            - conflict rule: for .github/workflows/**, prefer upstream (theirs)

            Notes:
            - If non-workflow conflicts occur, this workflow will fail and you must resolve manually.
          labels: |
            upstream-sync
          draft: false
          delete-branch: false
          auto-merge: true
          merge-method: squash
